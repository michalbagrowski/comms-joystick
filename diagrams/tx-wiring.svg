<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Transmitter (TX) Wiring Diagram</text>

  <!-- ESP32-C3 Board -->
  <rect x="300" y="120" width="200" height="280" rx="8" fill="#2d5a27" stroke="#1a3a17" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ESP32-C3</text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#aaffaa">Super Mini</text>

  <!-- ESP32 Pins Left Side -->
  <g font-family="monospace" font-size="11" fill="white">
    <rect x="305" y="190" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="203" text-anchor="middle">GPIO0</text>
    <rect x="305" y="215" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="228" text-anchor="middle">GPIO1</text>
    <rect x="305" y="240" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="253" text-anchor="middle">GPIO2</text>
    <rect x="305" y="265" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="278" text-anchor="middle">GPIO3</text>
    <rect x="305" y="290" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="303" text-anchor="middle">GPIO4</text>
    <rect x="305" y="315" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="328" text-anchor="middle">GPIO5</text>
    <rect x="305" y="340" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="353" text-anchor="middle">GPIO6</text>
    <rect x="305" y="365" width="60" height="18" rx="2" fill="#444"/>
    <text x="335" y="378" text-anchor="middle">GPIO7</text>
  </g>

  <!-- ESP32 Pins Right Side -->
  <g font-family="monospace" font-size="11" fill="white">
    <rect x="435" y="190" width="60" height="18" rx="2" fill="#c41e3a"/>
    <text x="465" y="203" text-anchor="middle">3.3V</text>
    <rect x="435" y="215" width="60" height="18" rx="2" fill="#333"/>
    <text x="465" y="228" text-anchor="middle">GND</text>
    <rect x="435" y="265" width="60" height="18" rx="2" fill="#444"/>
    <text x="465" y="278" text-anchor="middle">GPIO10</text>
  </g>

  <!-- Joystick 1 -->
  <rect x="50" y="160" width="120" height="120" rx="8" fill="#4a90d9" stroke="#2a70b9" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Joystick 1</text>
  <circle cx="110" cy="230" r="20" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="110" cy="230" r="8" fill="#666"/>
  <g font-family="monospace" font-size="9" fill="white">
    <text x="60" y="265">VRx</text>
    <text x="90" y="265">VRy</text>
    <text x="120" y="265">SW</text>
    <text x="145" y="265">VCC</text>
  </g>

  <!-- Joystick 2 -->
  <rect x="50" y="300" width="120" height="120" rx="8" fill="#4a90d9" stroke="#2a70b9" stroke-width="2"/>
  <text x="110" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Joystick 2</text>
  <circle cx="110" cy="370" r="20" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="110" cy="370" r="8" fill="#666"/>
  <g font-family="monospace" font-size="9" fill="white">
    <text x="60" y="405">VRx</text>
    <text x="90" y="405">VRy</text>
    <text x="120" y="405">SW</text>
    <text x="145" y="405">VCC</text>
  </g>

  <!-- OLED Display -->
  <rect x="600" y="200" width="140" height="100" rx="8" fill="#1a1a2e" stroke="#0f0f1a" stroke-width="2"/>
  <rect x="615" y="215" width="110" height="55" rx="4" fill="#000" stroke="#333"/>
  <text x="670" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#00ff00">128x64 OLED</text>
  <text x="670" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">1.9" SH1106</text>
  <g font-family="monospace" font-size="9" fill="white">
    <text x="615" y="290">VCC</text>
    <text x="645" y="290">GND</text>
    <text x="680" y="290">SCL</text>
    <text x="715" y="290">SDA</text>
  </g>

  <!-- Connection Lines - Joystick 1 -->
  <g stroke="#e74c3c" stroke-width="2" fill="none">
    <path d="M 170 199 L 240 199 L 240 199 L 305 199"/>
    <text x="220" y="193" font-family="Arial" font-size="9" fill="#e74c3c">VRx</text>
  </g>
  <g stroke="#3498db" stroke-width="2" fill="none">
    <path d="M 170 224 L 250 224 L 305 224"/>
    <text x="220" y="218" font-family="Arial" font-size="9" fill="#3498db">VRy</text>
  </g>
  <g stroke="#9b59b6" stroke-width="2" fill="none">
    <path d="M 170 249 L 260 249 L 305 249"/>
    <text x="220" y="243" font-family="Arial" font-size="9" fill="#9b59b6">SW</text>
  </g>

  <!-- Connection Lines - Joystick 2 -->
  <g stroke="#e74c3c" stroke-width="2" fill="none">
    <path d="M 170 339 L 230 339 L 230 274 L 305 274"/>
    <text x="180" y="333" font-family="Arial" font-size="9" fill="#e74c3c">VRx</text>
  </g>
  <g stroke="#3498db" stroke-width="2" fill="none">
    <path d="M 170 364 L 220 364 L 220 299 L 305 299"/>
    <text x="180" y="358" font-family="Arial" font-size="9" fill="#3498db">VRy</text>
  </g>
  <g stroke="#9b59b6" stroke-width="2" fill="none">
    <path d="M 170 389 L 210 389 L 210 324 L 305 324"/>
    <text x="180" y="383" font-family="Arial" font-size="9" fill="#9b59b6">SW</text>
  </g>

  <!-- 3.3V Power Lines -->
  <g stroke="#c41e3a" stroke-width="2" fill="none" stroke-dasharray="5,3">
    <path d="M 495 199 L 550 199 L 550 80 L 160 80 L 160 160"/>
    <path d="M 160 280 L 160 300"/>
    <path d="M 550 199 L 600 199 L 600 275 L 615 275"/>
  </g>

  <!-- GND Lines -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M 495 224 L 560 224 L 560 90 L 50 90 L 50 280"/>
    <path d="M 50 280 L 50 420"/>
    <path d="M 560 224 L 590 224 L 590 275 L 645 275"/>
  </g>

  <!-- Display I2C Lines -->
  <g stroke="#f39c12" stroke-width="2" fill="none">
    <path d="M 365 349 L 580 349 L 580 275 L 680 275"/>
    <text x="540" y="343" font-family="Arial" font-size="9" fill="#f39c12">SDA</text>
  </g>
  <g stroke="#27ae60" stroke-width="2" fill="none">
    <path d="M 365 374 L 570 374 L 570 275 L 715 275"/>
    <text x="540" y="368" font-family="Arial" font-size="9" fill="#27ae60">SCL</text>
  </g>

  <!-- Legend -->
  <rect x="550" y="380" width="200" height="100" rx="5" fill="white" stroke="#ccc"/>
  <text x="650" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <line x1="560" y1="415" x2="590" y2="415" stroke="#c41e3a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="600" y="419" font-family="Arial" font-size="10" fill="#333">3.3V Power</text>
  <line x1="560" y1="435" x2="590" y2="435" stroke="#333" stroke-width="2"/>
  <text x="600" y="439" font-family="Arial" font-size="10" fill="#333">Ground</text>
  <line x1="560" y1="455" x2="590" y2="455" stroke="#f39c12" stroke-width="2"/>
  <text x="600" y="459" font-family="Arial" font-size="10" fill="#333">I2C SDA</text>
  <line x1="560" y1="470" x2="590" y2="470" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="474" font-family="Arial" font-size="10" fill="#333">I2C SCL</text>

  <!-- Warning -->
  <rect x="50" y="440" width="250" height="40" rx="5" fill="#fff3cd" stroke="#ffc107"/>
  <text x="175" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">Use 3.3V for joysticks and display!</text>
  <text x="175" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#856404">5V will damage the OLED</text>
</svg>
