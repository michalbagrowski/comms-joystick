<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <!-- Background -->
  <rect width="800" height="550" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">RX LiPo Power Circuit with Boost Converter</text>
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">3.7V LiPo → 5V for servo and motors</text>

  <!-- Main Circuit Area -->
  <rect x="30" y="70" width="740" height="380" rx="10" fill="white" stroke="#ddd" stroke-width="2"/>

  <!-- LiPo Battery -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="80" height="140" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <rect x="25" y="-10" width="30" height="12" rx="2" fill="#2980b9"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">LiPo</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d6eaf8">1S 3.7V</text>
    <text x="40" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d6eaf8">1000-</text>
    <text x="40" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d6eaf8">2000mAh</text>

    <!-- Battery terminals -->
    <rect x="60" y="35" width="25" height="18" rx="2" fill="#c41e3a"/>
    <text x="72" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="white">+</text>
    <rect x="60" y="90" width="25" height="18" rx="2" fill="#333"/>
    <text x="72" y="103" text-anchor="middle" font-family="Arial" font-size="10" fill="white">-</text>
  </g>

  <!-- MT3608 Boost Converter -->
  <rect x="200" y="120" width="140" height="120" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="270" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">MT3608</text>
  <text x="270" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#d5f5e3">Boost Converter</text>

  <!-- MT3608 Potentiometer -->
  <circle cx="270" cy="190" r="15" fill="#1e8449" stroke="#145a32" stroke-width="2"/>
  <line x1="270" y1="180" x2="270" y2="200" stroke="#fff" stroke-width="2"/>
  <text x="270" y="215" text-anchor="middle" font-family="Arial" font-size="8" fill="#d5f5e3">Adjust to 5V</text>

  <!-- MT3608 Pins -->
  <g font-family="monospace" font-size="9" fill="white">
    <rect x="205" y="155" width="35" height="16" rx="2" fill="#c41e3a"/>
    <text x="222" y="166" text-anchor="middle">VIN+</text>
    <rect x="205" y="175" width="35" height="16" rx="2" fill="#333"/>
    <text x="222" y="186" text-anchor="middle">VIN-</text>

    <rect x="300" y="155" width="35" height="16" rx="2" fill="#e67e22"/>
    <text x="317" y="166" text-anchor="middle">VOUT+</text>
    <rect x="300" y="175" width="35" height="16" rx="2" fill="#333"/>
    <text x="317" y="186" text-anchor="middle">VOUT-</text>
  </g>

  <!-- Input Capacitors -->
  <g transform="translate(160, 280)">
    <rect x="0" y="0" width="60" height="50" rx="3" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1"/>
    <text x="30" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#16a085">Input Caps</text>
    <!-- Electrolytic cap symbol -->
    <line x1="15" y1="25" x2="15" y2="45" stroke="#333" stroke-width="2"/>
    <rect x="10" y="30" width="10" height="8" fill="none" stroke="#333" stroke-width="1"/>
    <text x="15" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#333">100µF</text>
    <!-- Ceramic cap symbol -->
    <line x1="45" y1="25" x2="45" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="33" x2="50" y2="33" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="37" x2="50" y2="37" stroke="#333" stroke-width="2"/>
    <text x="45" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#333">0.1µF</text>
  </g>

  <!-- Output Capacitors -->
  <g transform="translate(360, 280)">
    <rect x="0" y="0" width="60" height="50" rx="3" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
    <text x="30" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#d68910">Output Caps</text>
    <!-- Electrolytic cap symbol -->
    <line x1="15" y1="25" x2="15" y2="45" stroke="#333" stroke-width="2"/>
    <rect x="10" y="30" width="10" height="8" fill="none" stroke="#333" stroke-width="1"/>
    <text x="15" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#333">100µF</text>
    <!-- Ceramic cap symbol -->
    <line x1="45" y1="25" x2="45" y2="45" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="33" x2="50" y2="33" stroke="#333" stroke-width="2"/>
    <line x1="40" y1="37" x2="50" y2="37" stroke="#333" stroke-width="2"/>
    <text x="45" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#333">0.1µF</text>
  </g>

  <!-- ESP32 -->
  <rect x="480" y="100" width="120" height="180" rx="5" fill="#2d5a27" stroke="#1a3a17" stroke-width="2"/>
  <text x="540" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">ESP32-C3</text>

  <g font-family="monospace" font-size="9" fill="white">
    <rect x="485" y="140" width="45" height="16" rx="2" fill="#e67e22"/>
    <text x="507" y="151" text-anchor="middle">5V</text>
    <rect x="485" y="160" width="45" height="16" rx="2" fill="#8e44ad"/>
    <text x="507" y="171" text-anchor="middle">3.3V</text>
    <rect x="485" y="180" width="45" height="16" rx="2" fill="#333"/>
    <text x="507" y="191" text-anchor="middle">GND</text>
    <rect x="485" y="210" width="55" height="16" rx="2" fill="#f39c12"/>
    <text x="512" y="221" text-anchor="middle">GPIO10</text>
    <rect x="485" y="240" width="55" height="16" rx="2" fill="#444"/>
    <text x="512" y="251" text-anchor="middle">GPIO0-5</text>
  </g>

  <!-- Servo -->
  <rect x="650" y="100" width="90" height="70" rx="5" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="695" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Servo</text>
  <text x="695" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fdebd0">SG90</text>

  <!-- MX1508 -->
  <rect x="650" y="190" width="90" height="70" rx="5" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
  <text x="695" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">MX1508</text>
  <text x="695" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d7bde2">Motors</text>

  <!-- Motor Power Capacitor -->
  <g transform="translate(650, 280)">
    <rect x="0" y="0" width="90" height="45" rx="3" fill="#fdedec" stroke="#e74c3c" stroke-width="1"/>
    <text x="45" y="15" text-anchor="middle" font-family="Arial" font-size="8" fill="#c0392b">Motor Caps</text>
    <line x1="30" y1="25" x2="30" y2="40" stroke="#333" stroke-width="2"/>
    <rect x="25" y="28" width="10" height="8" fill="none" stroke="#333" stroke-width="1"/>
    <text x="45" y="38" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">1000µF</text>
  </g>

  <!-- Voltage Divider for Battery Monitoring -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="90" height="80" rx="5" fill="#fef5e7" stroke="#f39c12" stroke-width="1"/>
    <text x="45" y="18" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#d68910">VBAT Sense</text>

    <!-- R1 -->
    <rect x="20" y="25" width="8" height="20" fill="#d4a574" stroke="#8b6914"/>
    <text x="24" y="55" text-anchor="middle" font-family="Arial" font-size="7" fill="#333">10K</text>

    <!-- R2 -->
    <rect x="20" y="55" width="8" height="20" fill="#d4a574" stroke="#8b6914"/>
    <text x="24" y="82" text-anchor="middle" font-family="Arial" font-size="7" fill="#333">10K</text>

    <!-- Junction -->
    <circle cx="24" cy="50" r="3" fill="#f39c12"/>
    <text x="55" y="55" font-family="Arial" font-size="8" fill="#333">→GPIO10</text>
  </g>

  <!-- Wiring -->
  <!-- Battery + to Boost VIN+ and voltage divider -->
  <line x1="135" y1="163" x2="175" y2="163" stroke="#c41e3a" stroke-width="3"/>
  <line x1="175" y1="163" x2="205" y2="163" stroke="#c41e3a" stroke-width="3"/>
  <line x1="175" y1="163" x2="175" y2="305" stroke="#c41e3a" stroke-width="2"/>
  <line x1="75" y1="305" x2="175" y2="305" stroke="#c41e3a" stroke-width="2"/>
  <line x1="175" y1="305" x2="175" y2="325" stroke="#c41e3a" stroke-width="2"/>
  <circle cx="175" cy="163" r="4" fill="#c41e3a"/>
  <circle cx="175" cy="305" r="4" fill="#c41e3a"/>

  <!-- Battery - to common GND -->
  <line x1="135" y1="218" x2="175" y2="218" stroke="#333" stroke-width="3"/>
  <line x1="175" y1="183" x2="175" y2="218" stroke="#333" stroke-width="2"/>
  <line x1="175" y1="183" x2="205" y2="183" stroke="#333" stroke-width="2"/>

  <!-- Boost output to ESP32 5V and loads -->
  <line x1="335" y1="163" x2="450" y2="163" stroke="#e67e22" stroke-width="3"/>
  <line x1="450" y1="148" x2="450" y2="163" stroke="#e67e22" stroke-width="3"/>
  <line x1="450" y1="148" x2="485" y2="148" stroke="#e67e22" stroke-width="3"/>
  <line x1="450" y1="163" x2="450" y2="115" stroke="#e67e22" stroke-width="3"/>
  <line x1="450" y1="115" x2="650" y2="115" stroke="#e67e22" stroke-width="3"/>
  <line x1="620" y1="115" x2="620" y2="205" stroke="#e67e22" stroke-width="3"/>
  <line x1="620" y1="205" x2="650" y2="205" stroke="#e67e22" stroke-width="3"/>
  <circle cx="450" cy="163" r="4" fill="#e67e22"/>
  <circle cx="450" cy="115" r="4" fill="#e67e22"/>
  <circle cx="620" cy="115" r="4" fill="#e67e22"/>

  <!-- GND bus -->
  <line x1="175" y1="218" x2="175" y2="400" stroke="#333" stroke-width="3"/>
  <line x1="175" y1="400" x2="700" y2="400" stroke="#333" stroke-width="3"/>
  <line x1="335" y1="183" x2="380" y2="183" stroke="#333" stroke-width="2"/>
  <line x1="380" y1="183" x2="380" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="507" y1="196" x2="507" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="695" y1="260" x2="695" y2="400" stroke="#333" stroke-width="2"/>
  <circle cx="175" cy="400" r="4" fill="#333"/>
  <circle cx="380" cy="400" r="4" fill="#333"/>
  <circle cx="507" cy="400" r="4" fill="#333"/>
  <circle cx="695" cy="400" r="4" fill="#333"/>

  <!-- Direct 3.7V to ESP32 for regulation -->
  <line x1="175" y1="163" x2="175" y2="100" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="175" y1="100" x2="430" y2="100" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="430" y1="100" x2="430" y2="168" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="430" y1="168" x2="485" y2="168" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- VBAT to GPIO10 -->
  <line x1="100" y1="350" x2="100" y2="370" stroke="#f39c12" stroke-width="2"/>
  <line x1="100" y1="370" x2="460" y2="370" stroke="#f39c12" stroke-width="2"/>
  <line x1="460" y1="218" x2="460" y2="370" stroke="#f39c12" stroke-width="2"/>
  <line x1="460" y1="218" x2="485" y2="218" stroke="#f39c12" stroke-width="2"/>

  <!-- Legend -->
  <rect x="50" y="460" width="700" height="70" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Power Flow</text>

  <line x1="80" y1="500" x2="110" y2="500" stroke="#c41e3a" stroke-width="3"/>
  <text x="120" y="504" font-family="Arial" font-size="10" fill="#333">LiPo 3.0-4.2V</text>

  <line x1="220" y1="500" x2="250" y2="500" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="260" y="504" font-family="Arial" font-size="10" fill="#333">Direct to ESP32 (3.3V reg)</text>

  <line x1="420" y1="500" x2="450" y2="500" stroke="#e67e22" stroke-width="3"/>
  <text x="460" y="504" font-family="Arial" font-size="10" fill="#333">Boosted 5V</text>

  <line x1="560" y1="500" x2="590" y2="500" stroke="#f39c12" stroke-width="2"/>
  <text x="600" y="504" font-family="Arial" font-size="10" fill="#333">VBAT Sense</text>

  <line x1="690" y1="500" x2="720" y2="500" stroke="#333" stroke-width="3"/>
  <text x="730" y="504" font-family="Arial" font-size="10" fill="#333">GND</text>
</svg>
