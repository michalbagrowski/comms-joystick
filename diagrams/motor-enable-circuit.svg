<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Motor Enable Circuit (2N2222)</text>
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Prevents motor twitch during ESP32 boot/reset</text>

  <!-- Main Circuit Area -->
  <rect x="50" y="70" width="500" height="250" rx="10" fill="white" stroke="#ddd" stroke-width="2"/>

  <!-- ESP32 Section -->
  <rect x="70" y="90" width="120" height="100" rx="5" fill="#2d5a27" stroke="#1a3a17" stroke-width="2"/>
  <text x="130" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ESP32-C3</text>

  <!-- GPIO5 Pin -->
  <rect x="150" y="140" width="40" height="20" rx="3" fill="#e67e22"/>
  <text x="170" y="154" text-anchor="middle" font-family="monospace" font-size="10" fill="white">GPIO5</text>

  <!-- GND Pin -->
  <rect x="150" y="165" width="40" height="20" rx="3" fill="#333"/>
  <text x="170" y="179" text-anchor="middle" font-family="monospace" font-size="10" fill="white">GND</text>

  <!-- 1K Resistor -->
  <g transform="translate(210, 140)">
    <rect x="0" y="5" width="60" height="10" fill="#d4a574" stroke="#8b6914" stroke-width="1"/>
    <rect x="5" y="2" width="5" height="16" fill="#8b4513"/>
    <rect x="15" y="2" width="5" height="16" fill="#000"/>
    <rect x="25" y="2" width="5" height="16" fill="#ff0000"/>
    <rect x="35" y="2" width="5" height="16" fill="#ffd700"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#333">1K</text>
  </g>

  <!-- Connection from GPIO5 to Resistor -->
  <line x1="190" y1="150" x2="210" y2="150" stroke="#e67e22" stroke-width="3"/>

  <!-- 2N2222 Transistor -->
  <g transform="translate(320, 100)">
    <!-- Transistor body -->
    <circle cx="50" cy="70" r="40" fill="#f5f5f5" stroke="#333" stroke-width="2"/>

    <!-- Internal structure -->
    <line x1="10" y1="70" x2="30" y2="70" stroke="#333" stroke-width="3"/>
    <line x1="30" y1="45" x2="30" y2="95" stroke="#333" stroke-width="3"/>
    <line x1="30" y1="55" x2="70" y2="30" stroke="#333" stroke-width="3"/>
    <line x1="30" y1="85" x2="70" y2="110" stroke="#333" stroke-width="3"/>

    <!-- Arrow on emitter -->
    <polygon points="55,95 70,110 60,100" fill="#333"/>

    <!-- Pin labels -->
    <text x="-5" y="75" font-family="Arial" font-size="12" font-weight="bold" fill="#e67e22">B</text>
    <text x="75" y="35" font-family="Arial" font-size="12" font-weight="bold" fill="#c41e3a">C</text>
    <text x="75" y="115" font-family="Arial" font-size="12" font-weight="bold" fill="#333">E</text>

    <!-- Transistor label -->
    <text x="50" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#333">2N2222</text>
  </g>

  <!-- Connection from Resistor to Base -->
  <line x1="270" y1="150" x2="310" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="150" x2="310" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="170" x2="330" y2="170" stroke="#333" stroke-width="2"/>

  <!-- MX1508 Section -->
  <rect x="430" y="90" width="100" height="80" rx="5" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">MX1508</text>
  <text x="480" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#d7bde2">Motor Driver</text>

  <!-- MX1508 GND Pin -->
  <rect x="450" y="145" width="35" height="18" rx="3" fill="#333"/>
  <text x="467" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="white">GND</text>

  <!-- Connection from Collector to MX1508 GND -->
  <line x1="390" y1="130" x2="410" y2="130" stroke="#c41e3a" stroke-width="2"/>
  <line x1="410" y1="130" x2="410" y2="154" stroke="#c41e3a" stroke-width="2"/>
  <line x1="410" y1="154" x2="450" y2="154" stroke="#c41e3a" stroke-width="2"/>

  <!-- Ground Bus -->
  <line x1="190" y1="175" x2="190" y2="280" stroke="#333" stroke-width="3"/>
  <line x1="190" y1="280" x2="390" y2="280" stroke="#333" stroke-width="3"/>
  <line x1="390" y1="210" x2="390" y2="280" stroke="#333" stroke-width="3"/>

  <!-- GND Symbol -->
  <g transform="translate(280, 280)">
    <line x1="0" y1="0" x2="0" y2="15" stroke="#333" stroke-width="3"/>
    <line x1="-15" y1="15" x2="15" y2="15" stroke="#333" stroke-width="3"/>
    <line x1="-10" y1="20" x2="10" y2="20" stroke="#333" stroke-width="2"/>
    <line x1="-5" y1="25" x2="5" y2="25" stroke="#333" stroke-width="1"/>
    <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">GND</text>
  </g>

  <!-- How it works section -->
  <rect x="50" y="330" width="500" height="60" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1"/>
  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">How it works:</text>
  <text x="300" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">At boot: GPIO5 = LOW → Transistor OFF → MX1508 has no GND → Motors can't run</text>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">After setup(): GPIO5 = HIGH → Transistor ON → MX1508 GND connected → Normal operation</text>

  <!-- Pin labels -->
  <g font-family="Arial" font-size="9" fill="#666">
    <text x="145" y="138">From ESP32</text>
    <text x="423" y="88">To Motor Driver</text>
  </g>

  <!-- Connection dots -->
  <circle cx="310" cy="170" r="4" fill="#333"/>
  <circle cx="190" cy="280" r="4" fill="#333"/>
  <circle cx="390" cy="280" r="4" fill="#333"/>
</svg>
