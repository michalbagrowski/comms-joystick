<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500">
  <!-- Background -->
  <rect width="700" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Compact RX Wiring - XIAO ESP32-C3 + DRV8833</text>
  <text x="350" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Miniaturized build for small chassis (~35x25mm footprint)</text>

  <!-- XIAO ESP32-C3 -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="100" height="140" rx="5" fill="#2d5a27" stroke="#1a3a17" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">XIAO ESP32-C3</text>
    <text x="50" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#aaffaa">21 x 17mm</text>

    <!-- USB-C port -->
    <rect x="35" y="125" width="30" height="12" rx="2" fill="#333"/>
    <text x="50" y="148" text-anchor="middle" font-family="Arial" font-size="7" fill="#666">USB-C</text>

    <!-- Left side pins D0-D5 -->
    <g font-family="monospace" font-size="7" fill="white">
      <rect x="5" y="45" width="30" height="12" rx="2" fill="#f39c12"/>
      <text x="20" y="54" text-anchor="middle">D0/A0</text>
      <rect x="5" y="60" width="30" height="12" rx="2" fill="#e74c3c"/>
      <text x="20" y="69" text-anchor="middle">D1</text>
      <rect x="5" y="75" width="30" height="12" rx="2" fill="#e74c3c"/>
      <text x="20" y="84" text-anchor="middle">D2</text>
      <rect x="5" y="90" width="30" height="12" rx="2" fill="#e74c3c"/>
      <text x="20" y="99" text-anchor="middle">D3</text>
      <rect x="5" y="105" width="30" height="12" rx="2" fill="#3498db"/>
      <text x="20" y="114" text-anchor="middle">D4/SDA</text>
    </g>

    <!-- Right side pins D5-D10 -->
    <g font-family="monospace" font-size="7" fill="white">
      <rect x="65" y="45" width="30" height="12" rx="2" fill="#3498db"/>
      <text x="80" y="54" text-anchor="middle">D5/SCL</text>
      <rect x="65" y="60" width="30" height="12" rx="2" fill="#e74c3c"/>
      <text x="80" y="69" text-anchor="middle">D6</text>
      <rect x="65" y="75" width="30" height="12" rx="2" fill="#27ae60"/>
      <text x="80" y="84" text-anchor="middle">D7</text>
      <rect x="65" y="90" width="30" height="12" rx="2" fill="#9b59b6"/>
      <text x="80" y="99" text-anchor="middle">D8</text>
      <rect x="65" y="105" width="30" height="12" rx="2" fill="#f1c40f"/>
      <text x="80" y="114" text-anchor="middle">D9</text>
    </g>
  </g>

  <!-- DRV8833 Motor Driver -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="80" height="100" rx="5" fill="#8e44ad" stroke="#6c3483" stroke-width="2"/>
    <text x="40" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">DRV8833</text>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d7bde2">10 x 15mm</text>

    <!-- Input pins -->
    <g font-family="monospace" font-size="7" fill="white">
      <rect x="55" y="40" width="22" height="10" rx="1" fill="#e74c3c"/>
      <text x="66" y="48" text-anchor="middle">AIN1</text>
      <rect x="55" y="52" width="22" height="10" rx="1" fill="#e74c3c"/>
      <text x="66" y="60" text-anchor="middle">AIN2</text>
      <rect x="55" y="64" width="22" height="10" rx="1" fill="#e74c3c"/>
      <text x="66" y="72" text-anchor="middle">BIN1</text>
      <rect x="55" y="76" width="22" height="10" rx="1" fill="#e74c3c"/>
      <text x="66" y="84" text-anchor="middle">BIN2</text>
    </g>

    <!-- Output pins -->
    <g font-family="monospace" font-size="7" fill="white">
      <rect x="3" y="40" width="22" height="10" rx="1" fill="#27ae60"/>
      <text x="14" y="48" text-anchor="middle">AOUT1</text>
      <rect x="3" y="52" width="22" height="10" rx="1" fill="#27ae60"/>
      <text x="14" y="60" text-anchor="middle">AOUT2</text>
      <rect x="3" y="64" width="22" height="10" rx="1" fill="#3498db"/>
      <text x="14" y="72" text-anchor="middle">BOUT1</text>
      <rect x="3" y="76" width="22" height="10" rx="1" fill="#3498db"/>
      <text x="14" y="84" text-anchor="middle">BOUT2</text>
    </g>

    <!-- Power/control pins at bottom -->
    <g font-family="monospace" font-size="6" fill="white">
      <rect x="5" y="90" width="18" height="8" rx="1" fill="#c41e3a"/>
      <text x="14" y="96" text-anchor="middle">VCC</text>
      <rect x="25" y="90" width="18" height="8" rx="1" fill="#333"/>
      <text x="34" y="96" text-anchor="middle">GND</text>
      <rect x="45" y="90" width="25" height="8" rx="1" fill="#27ae60"/>
      <text x="57" y="96" text-anchor="middle">nSLEEP</text>
    </g>
  </g>

  <!-- Motors -->
  <g transform="translate(20, 260)">
    <ellipse cx="25" cy="20" rx="22" ry="16" fill="#555" stroke="#333" stroke-width="2"/>
    <rect x="45" y="12" width="10" height="16" fill="#777"/>
    <text x="25" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">M1</text>
  </g>
  <g transform="translate(20, 310)">
    <ellipse cx="25" cy="20" rx="22" ry="16" fill="#555" stroke="#333" stroke-width="2"/>
    <rect x="45" y="12" width="10" height="16" fill="#777"/>
    <text x="25" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">M2</text>
  </g>

  <!-- Servo -->
  <g transform="translate(550, 120)">
    <rect x="0" y="0" width="70" height="50" rx="3" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <text x="35" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Linear</text>
    <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Servo</text>
    <g font-family="monospace" font-size="6" fill="white">
      <text x="15" y="45">GND</text>
      <text x="35" y="45">VCC</text>
      <text x="55" y="45">SIG</text>
    </g>
  </g>

  <!-- Display (optional) -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="70" height="55" rx="3" fill="#1a1a2e" stroke="#0f0f1a" stroke-width="2"/>
    <rect x="8" y="8" width="54" height="30" rx="2" fill="#000"/>
    <text x="35" y="27" text-anchor="middle" font-family="Arial" font-size="7" fill="#00ff00">0.42" OLED</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial" font-size="7" fill="#aaa">(optional)</text>
  </g>

  <!-- LiPo Battery -->
  <g transform="translate(400, 300)">
    <rect x="0" y="0" width="60" height="80" rx="3" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
    <rect x="20" y="-5" width="20" height="8" rx="2" fill="#2980b9"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">LiPo</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d6eaf8">3.7V</text>
    <text x="30" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d6eaf8">150-</text>
    <text x="30" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d6eaf8">300mAh</text>
  </g>

  <!-- Voltage Divider -->
  <g transform="translate(500, 320)">
    <rect x="0" y="0" width="50" height="50" rx="3" fill="#fef5e7" stroke="#f39c12"/>
    <text x="25" y="12" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#d68910">VBAT</text>
    <rect x="20" y="18" width="8" height="12" fill="#d4a574" stroke="#8b6914"/>
    <rect x="20" y="32" width="8" height="12" fill="#d4a574" stroke="#8b6914"/>
    <text x="35" y="27" font-family="Arial" font-size="6" fill="#333">10K</text>
    <text x="35" y="41" font-family="Arial" font-size="6" fill="#333">10K</text>
  </g>

  <!-- Wiring connections -->
  <!-- Motor driver inputs from XIAO -->
  <g stroke="#e74c3c" stroke-width="1.5" fill="none">
    <path d="M 255 150 L 200 150 L 200 165 L 130 165"/>
    <path d="M 255 165 L 210 165 L 210 177 L 130 177"/>
    <path d="M 255 180 L 220 180 L 220 189 L 130 189"/>
    <path d="M 350 145 L 380 145 L 380 110 L 180 110 L 180 201 L 130 201"/>
  </g>

  <!-- nSLEEP from D7 -->
  <g stroke="#27ae60" stroke-width="1.5" fill="none">
    <path d="M 350 160 L 390 160 L 390 250 L 100 250 L 100 218 L 130 218"/>
  </g>

  <!-- Servo signal from D8 -->
  <g stroke="#9b59b6" stroke-width="1.5" fill="none">
    <path d="M 350 175 L 420 175 L 420 100 L 595 100 L 595 120"/>
  </g>

  <!-- I2C to display -->
  <g stroke="#3498db" stroke-width="1.5" fill="none">
    <path d="M 255 195 L 230 195 L 230 270 L 520 270 L 520 255 L 570 255"/>
    <path d="M 350 130 L 440 130 L 440 260 L 590 260 L 590 255"/>
  </g>

  <!-- Battery voltage sense -->
  <g stroke="#f39c12" stroke-width="1.5" fill="none">
    <path d="M 255 135 L 240 135 L 240 345 L 500 345"/>
  </g>

  <!-- Motor outputs -->
  <g stroke="#27ae60" stroke-width="1.5" fill="none">
    <path d="M 50 165 L 30 165 L 30 275 L 45 275"/>
    <path d="M 50 177 L 40 177 L 40 285 L 70 285"/>
  </g>
  <g stroke="#3498db" stroke-width="1.5" fill="none">
    <path d="M 50 189 L 30 189 L 30 325 L 45 325"/>
    <path d="M 50 201 L 40 201 L 40 335 L 70 335"/>
  </g>

  <!-- Power lines -->
  <g stroke="#c41e3a" stroke-width="2" fill="none" stroke-dasharray="4,2">
    <path d="M 400 340 L 350 340 L 350 240 L 100 240 L 100 213 L 130 213"/>
    <path d="M 350 340 L 350 390 L 580 390 L 580 170 L 555 170"/>
  </g>

  <!-- GND lines -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M 400 370 L 300 370 L 300 430"/>
    <path d="M 300 370 L 130 370 L 130 218"/>
    <path d="M 300 370 L 300 255 L 510 255 L 510 370"/>
    <path d="M 510 255 L 560 255"/>
  </g>

  <!-- GND symbol -->
  <g transform="translate(290, 430)">
    <line x1="10" y1="0" x2="10" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="10" x2="20" y2="10" stroke="#333" stroke-width="3"/>
    <line x1="4" y1="14" x2="16" y2="14" stroke="#333" stroke-width="2"/>
    <line x1="8" y1="18" x2="12" y2="18" stroke="#333" stroke-width="1"/>
  </g>

  <!-- Pin mapping table -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="250" height="110" rx="5" fill="white" stroke="#ccc"/>
    <text x="125" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">XIAO Pin Mapping</text>
    <line x1="0" y1="20" x2="250" y2="20" stroke="#ccc"/>
    <g font-family="monospace" font-size="8" fill="#333">
      <text x="10" y="33">D0 (GPIO2)  → Battery sense (ADC)</text>
      <text x="10" y="45">D1 (GPIO3)  → DRV8833 AIN1</text>
      <text x="10" y="57">D2 (GPIO4)  → DRV8833 AIN2</text>
      <text x="10" y="69">D3 (GPIO5)  → DRV8833 BIN1</text>
      <text x="10" y="81">D4 (GPIO6)  → I2C SDA (display)</text>
      <text x="10" y="93">D5 (GPIO7)  → I2C SCL (display)</text>
      <text x="10" y="105">D6 (GPIO21) → DRV8833 BIN2</text>
    </g>
  </g>

  <g transform="translate(320, 380)">
    <rect x="0" y="0" width="200" height="110" rx="5" fill="white" stroke="#ccc"/>
    <g font-family="monospace" font-size="8" fill="#333">
      <text x="10" y="15">D7 (GPIO20) → DRV8833 nSLEEP</text>
      <text x="10" y="27">D8 (GPIO8)  → Servo signal</text>
      <text x="10" y="39">D9 (GPIO9)  → Status LED</text>
    </g>
    <line x1="0" y1="48" x2="200" y2="48" stroke="#ccc"/>
    <text x="100" y="62" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#27ae60">No transistor needed!</text>
    <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">DRV8833 nSLEEP pin</text>
    <text x="100" y="87" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">replaces 2N2222 circuit</text>
    <text x="100" y="102" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">LOW=motors off, HIGH=on</text>
  </g>

  <!-- Legend -->
  <g transform="translate(550, 280)">
    <rect x="0" y="0" width="130" height="90" rx="3" fill="white" stroke="#ccc"/>
    <text x="65" y="14" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#333">Legend</text>
    <line x1="10" y1="26" x2="30" y2="26" stroke="#c41e3a" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="35" y="29" font-family="Arial" font-size="8" fill="#333">3.7V Power</text>
    <line x1="10" y1="40" x2="30" y2="40" stroke="#333" stroke-width="2"/>
    <text x="35" y="43" font-family="Arial" font-size="8" fill="#333">Ground</text>
    <line x1="10" y1="54" x2="30" y2="54" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="35" y="57" font-family="Arial" font-size="8" fill="#333">Motor PWM</text>
    <line x1="10" y1="68" x2="30" y2="68" stroke="#27ae60" stroke-width="1.5"/>
    <text x="35" y="71" font-family="Arial" font-size="8" fill="#333">Motor Enable</text>
    <line x1="10" y1="82" x2="30" y2="82" stroke="#3498db" stroke-width="1.5"/>
    <text x="35" y="85" font-family="Arial" font-size="8" fill="#333">I2C</text>
  </g>
</svg>
