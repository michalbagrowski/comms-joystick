<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c2c2c"/>
      <stop offset="50%" style="stop-color:#444"/>
      <stop offset="100%" style="stop-color:#2c2c2c"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="150" y="20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">RX Car Chassis - Top View</text>

  <!-- Wheels -->
  <!-- Front Left -->
  <ellipse cx="65" cy="80" rx="20" ry="10" fill="url(#wheelGrad)" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Front Right -->
  <ellipse cx="235" cy="80" rx="20" ry="10" fill="url(#wheelGrad)" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Rear Left -->
  <ellipse cx="65" cy="320" rx="20" ry="10" fill="url(#wheelGrad)" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Rear Right -->
  <ellipse cx="235" cy="320" rx="20" ry="10" fill="url(#wheelGrad)" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Main chassis body -->
  <rect x="90" y="50" width="120" height="300" rx="10" ry="10"
        fill="url(#chassisGrad)" stroke="#922" stroke-width="2"/>

  <!-- Wheel wells -->
  <path d="M90,65 Q75,80 90,95" fill="none" stroke="#722" stroke-width="3"/>
  <path d="M210,65 Q225,80 210,95" fill="none" stroke="#722" stroke-width="3"/>
  <path d="M90,305 Q75,320 90,335" fill="none" stroke="#722" stroke-width="3"/>
  <path d="M210,305 Q225,320 210,335" fill="none" stroke="#722" stroke-width="3"/>

  <!-- Front section - Servo -->
  <g transform="translate(125, 70)">
    <rect x="0" y="0" width="50" height="30" rx="2" fill="#333" stroke="#222"/>
    <rect x="20" y="-15" width="10" height="20" fill="#555" stroke="#444"/>
    <text x="25" y="45" text-anchor="middle" font-family="Arial" font-size="7" fill="#666">GS-1502</text>
    <text x="25" y="55" text-anchor="middle" font-family="Arial" font-size="6" fill="#888">Servo</text>
  </g>

  <!-- Center section - Electronics -->
  <g transform="translate(105, 140)">
    <!-- XIAO ESP32-C3 -->
    <rect x="0" y="0" width="40" height="35" rx="2" fill="#1a5a1a" stroke="#333"/>
    <rect x="35" y="12" width="8" height="10" fill="#888"/>
    <text x="20" y="20" text-anchor="middle" font-family="Arial" font-size="6" fill="#fff">XIAO</text>
    <text x="20" y="50" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">ESP32-C3</text>
  </g>

  <g transform="translate(155, 140)">
    <!-- DRV8833 -->
    <rect x="0" y="0" width="30" height="20" rx="2" fill="#1a1a5a" stroke="#333"/>
    <text x="15" y="12" text-anchor="middle" font-family="Arial" font-size="5" fill="#fff">DRV</text>
    <text x="15" y="35" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">DRV8833</text>
  </g>

  <!-- Battery -->
  <g transform="translate(120, 195)">
    <rect x="0" y="0" width="60" height="30" rx="3" fill="#3a3a8a" stroke="#333"/>
    <text x="30" y="18" text-anchor="middle" font-family="Arial" font-size="7" fill="#fff">LiPo 100mAh</text>
  </g>

  <!-- Rear section - Motors -->
  <g transform="translate(100, 265)">
    <!-- Motor 1 (left) -->
    <ellipse cx="15" cy="25" rx="12" ry="20" fill="#444" stroke="#333"/>
    <line x1="15" y1="45" x2="15" y2="55" stroke="#666" stroke-width="2"/>
    <text x="15" y="70" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">M1</text>
  </g>

  <g transform="translate(170, 265)">
    <!-- Motor 2 (right) -->
    <ellipse cx="15" cy="25" rx="12" ry="20" fill="#444" stroke="#333"/>
    <line x1="15" y1="45" x2="15" y2="55" stroke="#666" stroke-width="2"/>
    <text x="15" y="70" text-anchor="middle" font-family="Arial" font-size="6" fill="#666">M2</text>
  </g>

  <!-- Axles -->
  <line x1="65" y1="80" x2="235" y2="80" stroke="#666" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="65" y1="320" x2="235" y2="320" stroke="#666" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Vent slots -->
  <rect x="130" y="120" width="40" height="3" rx="1" fill="#722"/>
  <rect x="130" y="240" width="40" height="3" rx="1" fill="#722"/>

  <!-- Dimensions -->
  <g fill="none" stroke="#666" stroke-width="1">
    <line x1="50" y1="50" x2="50" y2="350"/>
    <line x1="45" y1="50" x2="55" y2="50"/>
    <line x1="45" y1="350" x2="55" y2="350"/>
  </g>
  <text x="35" y="200" text-anchor="middle" font-family="Arial" font-size="9" fill="#666"
        transform="rotate(-90, 35, 200)">80mm</text>

  <g fill="none" stroke="#666" stroke-width="1">
    <line x1="90" y1="370" x2="210" y2="370"/>
    <line x1="90" y1="365" x2="90" y2="375"/>
    <line x1="210" y1="365" x2="210" y2="375"/>
  </g>
  <text x="150" y="385" text-anchor="middle" font-family="Arial" font-size="9" fill="#666">32mm</text>

  <!-- Direction indicator -->
  <polygon points="150,35 145,45 155,45" fill="#333"/>
  <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">FRONT</text>
</svg>
