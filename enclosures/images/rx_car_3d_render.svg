<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="bodyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0392b"/>
      <stop offset="100%" style="stop-color:#8b1a1a"/>
    </linearGradient>
    <linearGradient id="bodyFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a02525"/>
      <stop offset="100%" style="stop-color:#d63031"/>
    </linearGradient>
    <linearGradient id="wheelSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="30%" style="stop-color:#3a3a3a"/>
      <stop offset="70%" style="stop-color:#3a3a3a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <radialGradient id="wheelFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#555"/>
      <stop offset="60%" style="stop-color:#333"/>
      <stop offset="100%" style="stop-color:#222"/>
    </radialGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">RX Car - 3D Render (Hot Wheels Scale)</text>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="260" rx="100" ry="20" fill="url(#shadow)"/>

  <!-- Back wheels (behind body) -->
  <!-- Back left wheel -->
  <g transform="translate(95, 180)">
    <ellipse cx="0" cy="20" rx="8" ry="20" fill="url(#wheelSide)"/>
  </g>

  <!-- Car body - 3D isometric view -->
  <g transform="translate(100, 100)">
    <!-- Bottom/underside (barely visible) -->
    <path d="M20,110 L180,110 L200,100 L40,100 Z" fill="#4a1a1a"/>

    <!-- Left side -->
    <path d="M0,30 L20,110 L40,100 L20,20 Z" fill="url(#bodySide)"/>

    <!-- Front face -->
    <path d="M0,30 L20,20 L180,20 L160,30 Z" fill="url(#bodyFront)"/>

    <!-- Right side (main visible) -->
    <path d="M160,30 L180,20 L200,100 L180,110 Z" fill="url(#bodySide)"/>

    <!-- Top surface -->
    <path d="M20,20 L180,20 L200,100 L40,100 Z" fill="url(#bodyTop)" stroke="#922" stroke-width="1"/>

    <!-- Wheel well shadows (left) -->
    <ellipse cx="35" cy="35" rx="18" ry="10" fill="#5a1a1a"/>
    <ellipse cx="35" cy="85" rx="18" ry="10" fill="#5a1a1a"/>

    <!-- Wheel well shadows (right) -->
    <ellipse cx="165" cy="35" rx="18" ry="10" fill="#5a1a1a"/>
    <ellipse cx="165" cy="85" rx="18" ry="10" fill="#5a1a1a"/>

    <!-- Vent slots on top -->
    <rect x="80" y="40" width="40" height="4" rx="2" fill="#722"/>
    <rect x="80" y="55" width="40" height="4" rx="2" fill="#722"/>
    <rect x="80" y="70" width="40" height="4" rx="2" fill="#722"/>

    <!-- Servo arm slot -->
    <rect x="90" y="25" width="20" height="10" rx="1" fill="#4a1a1a"/>
    <!-- Servo arm -->
    <rect x="95" y="20" width="10" height="12" rx="1" fill="#555"/>
  </g>

  <!-- Front wheels -->
  <!-- Front left wheel (visible face) -->
  <g transform="translate(95, 105)">
    <ellipse cx="0" cy="20" rx="8" ry="20" fill="url(#wheelSide)"/>
    <ellipse cx="-5" cy="20" rx="18" ry="18" fill="url(#wheelFace)"/>
    <ellipse cx="-5" cy="20" rx="6" ry="6" fill="#666"/>
    <circle cx="-5" cy="20" r="2" fill="#888"/>
  </g>

  <!-- Front right wheel -->
  <g transform="translate(295, 105)">
    <ellipse cx="0" cy="20" rx="8" ry="20" fill="url(#wheelSide)"/>
    <ellipse cx="5" cy="20" rx="18" ry="18" fill="url(#wheelFace)"/>
    <ellipse cx="5" cy="20" rx="6" ry="6" fill="#666"/>
    <circle cx="5" cy="20" r="2" fill="#888"/>
  </g>

  <!-- Back left wheel (front face now visible) -->
  <g transform="translate(95, 180)">
    <ellipse cx="-5" cy="20" rx="18" ry="18" fill="url(#wheelFace)"/>
    <ellipse cx="-5" cy="20" rx="6" ry="6" fill="#666"/>
    <circle cx="-5" cy="20" r="2" fill="#888"/>
  </g>

  <!-- Back right wheel -->
  <g transform="translate(295, 180)">
    <ellipse cx="0" cy="20" rx="8" ry="20" fill="url(#wheelSide)"/>
    <ellipse cx="5" cy="20" rx="18" ry="18" fill="url(#wheelFace)"/>
    <ellipse cx="5" cy="20" rx="6" ry="6" fill="#666"/>
    <circle cx="5" cy="20" r="2" fill="#888"/>
  </g>

  <!-- Axles (connecting lines) -->
  <line x1="95" y1="125" x2="295" y2="125" stroke="#666" stroke-width="2" opacity="0.3"/>
  <line x1="95" y1="200" x2="295" y2="200" stroke="#666" stroke-width="2" opacity="0.3"/>

  <!-- Specifications box -->
  <g transform="translate(280, 60)">
    <rect x="0" y="0" width="110" height="90" rx="5" fill="#fff" stroke="#ddd"/>
    <text x="10" y="18" font-family="Arial" font-size="9" font-weight="bold" fill="#333">Specifications:</text>
    <text x="10" y="32" font-family="Arial" font-size="8" fill="#666">Length: 80mm</text>
    <text x="10" y="44" font-family="Arial" font-size="8" fill="#666">Width: 32mm</text>
    <text x="10" y="56" font-family="Arial" font-size="8" fill="#666">Height: 18mm</text>
    <text x="10" y="68" font-family="Arial" font-size="8" fill="#666">Wheel: 20mm dia</text>
    <text x="10" y="80" font-family="Arial" font-size="8" fill="#666">Weight: ~50g</text>
  </g>

  <!-- Scale reference -->
  <g transform="translate(30, 250)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="-5" x2="80" y2="5" stroke="#333" stroke-width="2"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">~80mm (actual size at 100%)</text>
  </g>
</svg>
