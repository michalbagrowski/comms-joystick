<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5a"/>
      <stop offset="100%" style="stop-color:#0a1a2a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">TX Controller - Top View</text>

  <!-- Main case body -->
  <rect x="50" y="40" width="300" height="180" rx="20" ry="20" fill="url(#caseGrad)" stroke="#222" stroke-width="2"/>

  <!-- Left Joystick -->
  <circle cx="130" cy="130" r="35" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="130" cy="130" r="28" fill="#444" stroke="#333" stroke-width="1"/>
  <circle cx="130" cy="130" r="12" fill="#555" stroke="#444" stroke-width="1"/>
  <!-- Joystick mounting holes -->
  <circle cx="100" cy="100" r="2" fill="#222"/>
  <circle cx="160" cy="100" r="2" fill="#222"/>
  <circle cx="100" cy="160" r="2" fill="#222"/>
  <circle cx="160" cy="160" r="2" fill="#222"/>

  <!-- Right Joystick -->
  <circle cx="270" cy="130" r="35" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="270" cy="130" r="28" fill="#444" stroke="#333" stroke-width="1"/>
  <circle cx="270" cy="130" r="12" fill="#555" stroke="#444" stroke-width="1"/>
  <!-- Joystick mounting holes -->
  <circle cx="240" cy="100" r="2" fill="#222"/>
  <circle cx="300" cy="100" r="2" fill="#222"/>
  <circle cx="240" cy="160" r="2" fill="#222"/>
  <circle cx="300" cy="160" r="2" fill="#222"/>

  <!-- OLED Display -->
  <rect x="165" y="55" width="70" height="35" rx="3" ry="3" fill="#111" stroke="#333" stroke-width="1"/>
  <rect x="170" y="60" width="60" height="25" rx="2" ry="2" fill="url(#screenGrad)"/>
  <!-- Display content simulation -->
  <text x="200" y="72" text-anchor="middle" font-family="monospace" font-size="6" fill="#0f0">J1    J2</text>
  <circle cx="180" cy="77" r="4" fill="none" stroke="#0a0" stroke-width="0.5"/>
  <circle cx="220" cy="77" r="4" fill="none" stroke="#0a0" stroke-width="0.5"/>

  <!-- Corner screws -->
  <circle cx="70" cy="60" r="3" fill="#555" stroke="#333" stroke-width="1"/>
  <circle cx="330" cy="60" r="3" fill="#555" stroke="#333" stroke-width="1"/>
  <circle cx="70" cy="200" r="3" fill="#555" stroke="#333" stroke-width="1"/>
  <circle cx="330" cy="200" r="3" fill="#555" stroke="#333" stroke-width="1"/>

  <!-- Ventilation slots -->
  <rect x="145" y="190" width="20" height="3" rx="1" fill="#222"/>
  <rect x="175" y="190" width="20" height="3" rx="1" fill="#222"/>
  <rect x="205" y="190" width="20" height="3" rx="1" fill="#222"/>
  <rect x="235" y="190" width="20" height="3" rx="1" fill="#222"/>

  <!-- Labels -->
  <text x="130" y="180" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">JOY 1</text>
  <text x="270" y="180" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">JOY 2</text>
  <text x="200" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">DISPLAY</text>

  <!-- Dimensions -->
  <line x1="50" y1="235" x2="350" y2="235" stroke="#666" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="200" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">~160mm</text>
</svg>
