<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="450" height="400">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a5a5a"/>
      <stop offset="100%" style="stop-color:#3a3a3a"/>
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="225" y="20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">TX Controller - Exploded View</text>

  <!-- TOP LID (elevated) -->
  <g transform="translate(75, 30)">
    <!-- Main lid shape (isometric-ish) -->
    <path d="M0,40 L30,20 L330,20 L300,40 L300,80 L270,100 L30,100 L0,80 Z"
          fill="url(#topGrad)" stroke="#222" stroke-width="2"/>
    <!-- Top surface -->
    <path d="M30,20 L330,20 L300,40 L0,40 Z" fill="#666" stroke="#222" stroke-width="1"/>

    <!-- Joystick holes -->
    <ellipse cx="80" cy="55" rx="25" ry="15" fill="#222"/>
    <ellipse cx="220" cy="55" rx="25" ry="15" fill="#222"/>

    <!-- Display window -->
    <rect x="125" y="30" width="50" height="20" rx="2" fill="#111" stroke="#333"/>

    <!-- Label -->
    <text x="150" y="75" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">TOP LID</text>
  </g>

  <!-- COMPONENTS (middle layer) -->
  <g transform="translate(75, 140)">
    <!-- Joystick 1 -->
    <g transform="translate(50, 20)">
      <rect x="0" y="0" width="40" height="50" rx="3" fill="#1a1a8a" stroke="#333"/>
      <circle cx="20" cy="25" r="12" fill="#333" stroke="#222"/>
      <circle cx="20" cy="25" r="6" fill="#444"/>
      <text x="20" y="60" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">Joystick 1</text>
    </g>

    <!-- Joystick 2 -->
    <g transform="translate(210, 20)">
      <rect x="0" y="0" width="40" height="50" rx="3" fill="#1a1a8a" stroke="#333"/>
      <circle cx="20" cy="25" r="12" fill="#333" stroke="#222"/>
      <circle cx="20" cy="25" r="6" fill="#444"/>
      <text x="20" y="60" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">Joystick 2</text>
    </g>

    <!-- OLED Display -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="55" height="25" rx="2" fill="#222" stroke="#333"/>
      <rect x="5" y="3" width="45" height="19" fill="#0a1a2a"/>
      <text x="27" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">1.9" OLED</text>
    </g>

    <!-- ESP32 -->
    <g transform="translate(100, 80)">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="#1a5a1a" stroke="#333"/>
      <rect x="25" y="8" width="8" height="6" fill="#888"/>
      <text x="15" y="35" text-anchor="middle" font-family="Arial" font-size="7" fill="#666">ESP32-C3</text>
    </g>

    <!-- Battery -->
    <g transform="translate(160, 80)">
      <rect x="0" y="0" width="50" height="30" rx="3" fill="#3a3a8a" stroke="#333"/>
      <rect x="50" y="10" width="4" height="10" fill="#666"/>
      <text x="25" y="18" text-anchor="middle" font-family="Arial" font-size="7" fill="#fff">LiPo</text>
      <text x="27" y="45" text-anchor="middle" font-family="Arial" font-size="7" fill="#666">500mAh</text>
    </g>
  </g>

  <!-- BOTTOM CASE -->
  <g transform="translate(75, 270)">
    <!-- Main bottom shape (isometric-ish) -->
    <path d="M0,20 L30,0 L330,0 L300,20 L300,80 L270,100 L30,100 L0,80 Z"
          fill="url(#bottomGrad)" stroke="#222" stroke-width="2"/>
    <!-- Interior cavity indication -->
    <path d="M20,25 L40,15 L260,15 L280,25 L280,70 L260,80 L40,80 L20,70 Z"
          fill="#1a1a1a" stroke="#333" stroke-width="1"/>

    <!-- Screw posts -->
    <circle cx="40" cy="25" r="5" fill="#444" stroke="#333"/>
    <circle cx="260" cy="25" r="5" fill="#444" stroke="#333"/>
    <circle cx="40" cy="75" r="5" fill="#444" stroke="#333"/>
    <circle cx="260" cy="75" r="5" fill="#444" stroke="#333"/>

    <!-- USB port opening -->
    <rect x="295" y="40" width="8" height="15" fill="#222" stroke="#333"/>

    <!-- Label -->
    <text x="150" y="55" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">BOTTOM CASE</text>
  </g>

  <!-- Assembly arrows -->
  <g fill="none" stroke="#e74c3c" stroke-width="2">
    <path d="M225,125 L225,140" marker-end="url(#redarrow)"/>
    <path d="M225,255 L225,270" marker-end="url(#redarrow)"/>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Dimension annotations -->
  <text x="400" y="60" font-family="Arial" font-size="9" fill="#666">Top lid with</text>
  <text x="400" y="72" font-family="Arial" font-size="9" fill="#666">joystick holes</text>

  <text x="400" y="180" font-family="Arial" font-size="9" fill="#666">Components:</text>
  <text x="400" y="195" font-family="Arial" font-size="8" fill="#888">- 2x Joysticks</text>
  <text x="400" y="207" font-family="Arial" font-size="8" fill="#888">- OLED Display</text>
  <text x="400" y="219" font-family="Arial" font-size="8" fill="#888">- ESP32-C3</text>
  <text x="400" y="231" font-family="Arial" font-size="8" fill="#888">- LiPo Battery</text>

  <text x="400" y="310" font-family="Arial" font-size="9" fill="#666">Bottom case</text>
  <text x="400" y="322" font-family="Arial" font-size="9" fill="#666">with mounts</text>
</svg>
